name: Fix voice button

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/ner-memory-assist/src/App.tsx'
      - '.github/workflows/fix-voice-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch voice button
        shell: python
        run: |
          from pathlib import Path
          path = Path('artifacts/ner-memory-assist/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''function getSpeechRecognition() {
  const browser = window as unknown as {
    SpeechRecognition?: SpeechRecognitionConstructor;
    webkitSpeechRecognition?: SpeechRecognitionConstructor;
  };
  return browser.SpeechRecognition ?? browser.webkitSpeechRecognition;
}'''
          new = '''function getSpeechRecognition() {
  if (typeof window === 'undefined') return undefined;
  const browser = window as unknown as {
    SpeechRecognition?: SpeechRecognitionConstructor;
    webkitSpeechRecognition?: SpeechRecognitionConstructor;
  };
  return browser.SpeechRecognition ?? browser.webkitSpeechRecognition;
}'''
          if old in text:
              text = text.replace(old, new, 1)

          old_speak = '''  const speak = () => {
    const Speech = getSpeechRecognition();

    // Always give the user immediate feedback when the voice button is pressed.
    setListening(true);

    if (!Speech) {
      const message = translate('micUnavailable');
      speakText(message, lang);
      window.setTimeout(() => setListening(false), 2200);
      return;
    }

    const recognition = new Speech();
    recognition.lang = languageOptions.find((item) => item.id === lang)?.speechLocale ?? 'en-IN';
    recognition.onend = () => setListening(false);
    recognition.onerror = () => {
      setListening(false);
      speakText(translate('micUnavailable'), lang);
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0]?.[0]?.transcript ?? '';
      if (!transcript.trim()) return;
      dispatchVoiceCommand(transcript);
      const canonical = resolveVoiceCommand(lang, transcript);
      const response = canonical ? translate((titleKey[canonical] ?? 'home') as CopyKey) : transcript;
      window.setTimeout(() => { speakText(response, lang); }, 150);
    };

    try {
      recognition.start();
    } catch {
      setListening(false);
      speakText(translate('micUnavailable'), lang);
    }
  };'''
          new_speak = '''  const recognitionRef = useMemo(() => ({ current: null as SpeechRecognitionLike | null }), []);

  useEffect(() => {
    return () => {
      recognitionRef.current?.stop();
      recognitionRef.current = null;
    };
  }, [recognitionRef]);

  const speak = () => {
    if (listening) {
      recognitionRef.current?.stop();
      recognitionRef.current = null;
      setListening(false);
      return;
    }

    const Speech = getSpeechRecognition();
    if (!Speech) {
      setListening(true);
      speakText(translate('micUnavailable'), lang);
      window.setTimeout(() => setListening(false), 2200);
      return;
    }

    const recognition = new Speech();
    recognitionRef.current = recognition;
    recognition.lang = languageOptions.find((item) => item.id === lang)?.speechLocale ?? 'en-IN';
    recognition.onend = () => {
      if (recognitionRef.current === recognition) recognitionRef.current = null;
      setListening(false);
    };
    recognition.onerror = () => {
      if (recognitionRef.current === recognition) recognitionRef.current = null;
      setListening(false);
      speakText(translate('micUnavailable'), lang);
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0]?.[0]?.transcript ?? '';
      if (!transcript.trim()) return;
      dispatchVoiceCommand(transcript);
      const canonical = resolveVoiceCommand(lang, transcript);
      const response = canonical ? translate((titleKey[canonical] ?? 'home') as CopyKey) : transcript;
      window.setTimeout(() => { speakText(response, lang); }, 150);
    };

    setListening(true);
    try {
      recognition.start();
    } catch {
      recognitionRef.current = null;
      setListening(false);
      speakText(translate('micUnavailable'), lang);
    }
  };'''
          if old_speak in text:
              text = text.replace(old_speak, new_speak, 1)
          elif 'const recognitionRef = useMemo' not in text:
              raise SystemExit('Expected voice handler not found; no changes made.')

          old_button = '''            <button className={`flex min-h-12 min-w-12 items-center justify-center rounded-full ${listening ? 'bg-[hsl(var(--accent))] text-white' : 'bg-[hsl(var(--primary))] text-[hsl(var(--primary-foreground))]'}`} data-testid="button-voice" onClick={speak} title={translate('voice')}><Mic size={22} /></button>'''
          new_button = '''            <button type="button" aria-label={translate('voice')} className={`flex min-h-12 min-w-12 items-center justify-center rounded-full ${listening ? 'bg-[hsl(var(--accent))] text-white' : 'bg-[hsl(var(--primary))] text-[hsl(var(--primary-foreground))]'}`} data-testid="button-voice" onClick={speak} title={translate('voice')}><Mic size={22} /></button>'''
          if old_button in text:
              text = text.replace(old_button, new_button, 1)

          path.write_text(text, encoding='utf-8')

      - name: Patch multilingual voice command routing
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/ner-memory-assist/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { languageOptions, resolveVoiceCommand, t, type CopyKey, type Lang, type Role } from '@/lib/i18n';", "import { languageOptions, t, type CopyKey, type Lang, type Role } from '@/lib/i18n';\nimport { resolveMultilingualVoiceCommand } from '@/lib/voiceCommand';")
          s = s.replace("const canonical = resolveVoiceCommand(lang, command);", "const canonical = resolveMultilingualVoiceCommand(lang, command);")
          s = s.replace("      settings: '/settings',\n    };\n    const target = Object.entries(navigation).find(([phrase]) => normalized.includes(phrase) || canonical === phrase)?.[1];", "      settings: '/settings',\n      HOME: '/patient', OPEN_GAMES: '/games', OPEN_MEDICINE: '/medicine',\n      OPEN_MEMORIES: '/memories', OPEN_MUSIC: '/music', OPEN_PROGRESS: '/progress', OPEN_SETTINGS: '/settings',\n    };\n    const target = Object.entries(navigation).find(([phrase]) => normalized.includes(phrase) || canonical === phrase)?.[1];")
          s = s.replace("const canonical = resolveVoiceCommand(lang, transcript);", "const canonical = resolveMultilingualVoiceCommand(lang, transcript);")
          old = "      const canonical = resolveMultilingualVoiceCommand(lang, transcript);\n      const response = canonical ? translate((titleKey[canonical] ?? 'home') as CopyKey) : transcript;"
          new = "      const canonical = resolveMultilingualVoiceCommand(lang, transcript);\n      const canonicalRoute: Record<string, string> = {\n        HOME: '/patient', OPEN_GAMES: '/games', OPEN_MEDICINE: '/medicine',\n        OPEN_MEMORIES: '/memories', OPEN_MUSIC: '/music', OPEN_PROGRESS: '/progress', OPEN_SETTINGS: '/settings',\n      };\n      const response = canonical\n        ? translate(titleKey[canonicalRoute[canonical] ?? canonical] ?? 'home')\n        : transcript;"
          if old not in s:
              raise SystemExit('Multilingual voice response block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Install dependencies and build
        working-directory: artifacts/ner-memory-assist
        run: |
          npm ci
          npm run build

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- artifacts/ner-memory-assist/src/App.tsx; then
            echo 'No App.tsx change was necessary.'
            exit 0
          fi
          git add artifacts/ner-memory-assist/src/App.tsx
          git commit -m 'Fix multilingual voice command routing [voice-command-fixed]'
          git push
