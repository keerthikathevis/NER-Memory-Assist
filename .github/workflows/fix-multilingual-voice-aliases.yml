name: Fix multilingual voice aliases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multilingual-voice-aliases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add multilingual command aliases
