 */
export const speechRecognitionLocales: Record<Lang, string[]> = {
  en: ['en-IN', 'en-US', 'en'],
  ta: ['ta-IN', 'ta'],
  hi: ['hi-IN', 'hi'],
  as: ['as-IN', 'as'],
  bn: ['bn-IN', 'bn-BD', 'bn'],
  brx: ['brx-IN', 'brx'],
