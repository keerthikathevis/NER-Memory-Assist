  ne: ['ne-IN', 'ne-NP', 'ne'],
};

export function getSpeechRecognitionLocale(lang: Lang): string {
  return speechRecognitionLocales[lang]?.[0] ?? 'en-IN';
}
""", encoding='utf-8')

