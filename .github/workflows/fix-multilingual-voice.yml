name: Fix multilingual voice support

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/ner-memory-assist/src/lib/i18n.ts'
      - 'artifacts/ner-memory-assist/src/lib/voice.ts'
      - 'artifacts/ner-memory-assist/src/lib/voiceLocales.ts'
      - '.github/workflows/fix-multilingual-voice.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[multilingual-voice-fixed]') }}
    runs-on: ubuntu-latest
    steps:
