name: Integrate voice responses

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/ner-memory-assist/src/App.tsx'
      - 'artifacts/ner-memory-assist/src/lib/voice.ts'
      - '.github/workflows/voice-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[voice-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate robust voice handling into App.tsx
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/ner-memory-assist/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          if "from '@/lib/voice'" not in text:
              marker = "import { languageOptions, resolveVoiceCommand, t, type CopyKey, type Lang, type Role } from '@/lib/i18n';"
              replacement = marker + "\nimport { speakText } from '@/lib/voice';"
              if marker not in text:
                  raise SystemExit('Expected i18n import marker was not found; no changes made.')
              text = text.replace(marker, replacement, 1)

          old = """  const speak = () => {\n    const Speech = getSpeechRecognition();\n    if (!Speech) {\n      setListening(true);\n      window.setTimeout(() => setListening(false), 1800);\n      return;\n    }\n    const recognition = new Speech();\n    recognition.lang = languageOptions.find((item) => item.id === lang)?.speechLocale ?? 'en-IN';\n    recognition.onend = () => setListening(false);\n    recognition.onerror = () => setListening(false);\n    recognition.onresult = (event) => {\n      const transcript = event.results[0]?.[0]?.transcript ?? '';\n      dispatchVoiceCommand(transcript);\n      if (transcript.trim()) {\n        const canonical = resolveVoiceCommand(lang, transcript);\n        const response = canonical ? `${canonical}` : transcript;\n        window.setTimeout(() => { speakText(response, lang); }, 150);\n      }\n    };\n    setListening(true);\n    try { recognition.start(); } catch { setListening(false); }\n  };"""

          new = """  const speak = () => {\n    const Speech = getSpeechRecognition();\n\n    // Always give the user immediate feedback when the voice button is pressed.\n    setListening(true);\n\n    if (!Speech) {\n      const message = translate('micUnavailable');\n      speakText(message, lang);\n      window.setTimeout(() => setListening(false), 2200);\n      return;\n    }\n\n    const recognition = new Speech();\n    recognition.lang = languageOptions.find((item) => item.id === lang)?.speechLocale ?? 'en-IN';\n    recognition.onend = () => setListening(false);\n    recognition.onerror = () => {\n      setListening(false);\n      speakText(translate('micUnavailable'), lang);\n    };\n    recognition.onresult = (event) => {\n      const transcript = event.results[0]?.[0]?.transcript ?? '';\n      if (!transcript.trim()) return;\n      dispatchVoiceCommand(transcript);\n      const canonical = resolveVoiceCommand(lang, transcript);\n      const response = canonical ? translate((titleKey[canonical] ?? 'home') as CopyKey) : transcript;\n      window.setTimeout(() => { speakText(response, lang); }, 150);\n    };\n\n    try {\n      recognition.start();\n    } catch {\n      setListening(false);\n      speakText(translate('micUnavailable'), lang);\n    }\n  };"""

          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              print('Robust voice handling already present.')
          else:
              raise SystemExit('Expected voice handler was not found; no changes made.')

          path.write_text(text, encoding='utf-8')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- artifacts/ner-memory-assist/src/App.tsx; then
            echo 'No App.tsx changes needed.'
            exit 0
          fi
          git add artifacts/ner-memory-assist/src/App.tsx
          git commit -m 'Fix voice button handling [voice-integrated]'
          git push
